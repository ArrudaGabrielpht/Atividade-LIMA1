<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Responsivas</title>
    <style>
        .imagem-responsiva{
            height: auto;
            max-width: 100%;
            display: block;
        }
    .css-alternativo{
        width: 100%;
        height: auto;
        max-width: 1200px;
        display: block;
    }
    </style>
</head>

<body>

    <h1>Imagens Responsivas</h1>

    <p>Para voltar a página inicial, clique em
        <button><a href="index.html" style="text-decoration: none;">voltar</a></button>
    </p>

    <h2>Imagem responsiva com HTML puro</h2>

    <picture>
        <source media="(max-width:750px)" srcset="imagens/imagem_300.jpg" type="image/jpg">
        <source media="(max-width:1200px)" srcset="imagens/imagem_600.jpg" type="image/jpg">
        <img src="imagens/imagem_1200.jpg" alt="img responsiva">
    </picture>
    <h2>Imagem responsiva ultilizando CSS</h2>
    <img 
    class="imagem-responsiva"
    src="imagens/imagem_600.jpg"
    srcset="imagens/imagem_300.jpg 300w, imagens/imagem_600.jpg 600w, imagens/imagem_1200.jpg 1200w"
    sizes="(max-width:1200px) 100vw, 1200px" 
    alt="imagem responsiva ultilizando CSS"
    width="1200"
    height="auto"
    loading="lazy">

    <h2>Imagem responsiva alternativa com CSS</h2>
    <img src="imagens/imagem_1200.jpg" alt="sla" class="css-alternativo">


</body>

</html>
